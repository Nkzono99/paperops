# この paper draft から参照する外部 project / directory の共有 link 台帳。
#
# マシン固有の絶対パスは、意図的に ignore される _paperops/refs/local/locations.toml に置く。
# 各 link は location_ref で _paperops/refs/local/locations.example.toml / _paperops/refs/local/locations.toml
# の entry を参照する。

schema_version = 1

[[links]]
id = "runops-main"
kind = "runops_project"
location_ref = "runops_main"
description = "この draft の実験出力を作る主な runops project。"
paper_roles = ["results", "figures", "reproducibility"]
access = "read"
mcp_provider = "runops"
mcp_server = "runops"
preferred_export_paper_id = "paper-my-topic"
paper_request_queue = "research/paper_requests.toml"
paper_request_note = "_paperops/notes/views/research-requests.md"
mcp_tools = [
  "runops.publication.exports.list",
  "runops.publication.export.inspect",
  "runops.analysis.artifacts",
  "runops.survey.summary",
  "runops.analysis.plot_columns",
  "runops.paper.request.draft",
  "runops.paper.requests.list",
  "runops.paper.request.plan",
]

[[links]]
id = "figure-sources"
kind = "directory"
location_ref = "figure_sources"
description = "リポジトリ外にある編集可能な図表ソースファイル。"
paper_roles = ["figures"]
access = "read_write"

[[links]]
id = "external-notes"
kind = "directory"
location_ref = "external_notes"
description = "執筆中に参照する過去メモ、スライド断片、ローカル知識。"
paper_roles = ["background", "discussion"]
access = "read"
