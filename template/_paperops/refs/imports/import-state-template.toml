# 外部 export bundle を figure / table / claim evidence に使う前に、
# このファイルを _paperops/refs/imports/<link-id>-<bundle>.toml へコピーして埋める。

schema_version = 1
id = "IMP-0001"
link_id = "runops-main"
state = "script_only_candidate"
