schema_version: 1
authoring_axis:
  state: authoring
  allowed_states:
    - authoring
    - prediction-staged
    - executed
    - reconciled
    - revision-authoring
  living_manuscript: manuscript/
  notes: "manuscript/ is the living authoring source and may change after submission snapshots."
submission_axis:
  current_round: null
  allowed_states:
    - candidate
    - gated
    - frozen
    - submitted
    - under-review
    - revision-candidate
    - resubmitted
  rounds:
    - id: round-1
      venue: ""
      state: candidate
      snapshot_path: submission/<venue>/round-1/
      source_commit: ""
      gate_report: ""
      submitted_artifacts: []
      review_round: ""
      response_package: ""
      notes: "Fill this row when a real submission candidate is created."
