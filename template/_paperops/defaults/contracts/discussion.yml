section: discussion
purpose: >
  Results が何を意味するかを、観察、推論、機構、代替説明、含意、予測、限界に分けて説明する。

reader_question: その結果は何を意味するか

logic_chain:
  - principal_finding
  - mechanism
  - alternatives
  - prior_work
  - implication
  - boundary
  - prediction_or_next_test

claim_types:
  - observation
  - inference
  - mechanism_hypothesis
  - alternative_explanation
  - implication
  - prediction
  - limitation

inputs:
  - _paperops/claims/claims/
  - _paperops/claims/gates/
  - _paperops/evidence/results/
  - _paperops/evidence/sources/
  - _paperops/notes/views/claim-evidence-map.md
  - _paperops/notes/views/scientific-gate.md
  - _paperops/notes/related-work-map.md
  - _paperops/notes/reviewer-model.md
  - manuscript/writing-profile.yml

outputs:
  - reader knows how the result changes prior understanding
  - mechanism_hypothesis is distinguished from observation
  - alternative_explanation is named when relevant
  - baseline or comparator interpretation is scoped to what the control actually isolates
  - implication and prediction are scoped, not overclaimed
  - limitations say which claim they weaken

hard_rules:
  - Do not repeat Results as the main Discussion structure.
  - Do not treat every interpretive sentence as forbidden new evidence.
  - Mark mechanism_hypothesis, implication, and prediction with scope and warrant.
  - Do not use a baseline result as a real-world mechanism claim without naming the missing coupled process or boundary condition.
  - Attach limitations to affected claims.
  - Do not use hedge words as a substitute for scope.

soft_rules:
  - Start from the principal finding, not from a list of caveats.
  - "`section_depth` in `manuscript/writing-profile.yml` is a soft floor, not a target; expand only by adding missing mechanism warrant, prior-work delta, alternative, boundary, implication, or next test."
  - Subsections are allowed but not required. Avoid one-paragraph subsections; merge them or expand the interpretive function.
  - Discuss prior work where it changes interpretation.
  - Prefer one strong alternative explanation over a generic list.

audit_questions:
  - What does this paper make the reader think differently?
  - Which mechanism is most plausible, and why?
  - Which part of the interpretation depends on a baseline or control condition?
  - What observation or experiment would distinguish the interpretation?
  - Which limitation weakens which claim?
