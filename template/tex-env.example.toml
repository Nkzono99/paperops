# TeX 環境設定
# このファイルを tex-env.toml にコピーして編集する（.gitignore 対象）。
# 設定がない場合、ビルドスクリプトは PATH から latexmk を探す従来の動作にフォールバックする。

# ユーザー空間 TeX Live（HPC 等で root 権限がない場合）
# [texlive]
# root = "/path/to/texlive/2025"

# Docker でビルドする場合
# [docker]
# image = "texlive/texlive:latest"

# LaTeX engine を切り替える場合
# 既定は JA / EN ともに latexmk -pdf。
# latexmk がなく PAPER_TEMPLATE_RUN_LATEX=1 の場合、build script は direct-engine fallback を試す。
# 既定の fallback 順は JA: xelatex -> lualatex -> pdflatex、EN: lualatex -> xelatex -> pdflatex。
# 一時的に固定する場合:
#   PAPEROPS_JA_DIRECT_ENGINE=xelatex
#   PAPEROPS_EN_DIRECT_ENGINE=lualatex
# JA で uplatex + dvipdfmx を使う例:
# [latex.ja]
# latexmk_mode = "pdfdvi"
# latex = "uplatex -interaction=nonstopmode -halt-on-error %O %S"
# dvipdf = "dvipdfmx %O -o %D %S"
#
# EN 側を明示する例:
# [latex.en]
# latexmk_mode = "pdf"
