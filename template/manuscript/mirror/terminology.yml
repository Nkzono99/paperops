source_language: ja
target_language: en
terms:
  - id: T001
    ja: "中心概念を記入"
    en_public: "public scientific term"
    status: "needs_definition"  # public | needs_definition | internal_only | forbidden
    first_definition_required: true
    first_definition_location: ""
    avoid:
      - "internal_run_label"
      - "local_directory_name"
    allowed_context:
      - "manuscript-if-defined"
      - "notes"
    replacement_rule: "内部ラベルではなく、読者に通じる物理条件・選別基準・診断量として記述する。"
    figure_label_rule: "axis、legend、caption では en_public または定義済み略語を使う。"
    owner: ""
    last_reviewed: ""
  - id: INTERNAL-RUNOPS
    ja: "runops project"
    en_public: "analysis workflow"
    status: "internal_only"
    first_definition_required: false
    first_definition_location: ""
    avoid:
      - "publication export bundle"
      - "raw run directory"
      - "run label"
      - "production run"
      - "smoke/feasibility check"
      - "campaign"
      - "case"
    allowed_context:
      - "notes"
      - "refs"
    replacement_rule: "本文では外部 project 名や run label を出さず、analysis workflow、analysis dataset、figure-data package、exploratory check、simulation condition など読者向け語彙へ落とす。"
    figure_label_rule: "図表では run label や export 名ではなく、物理条件、選別基準、診断量、データ種別を書く。"
    owner: ""
    last_reviewed: ""
  - id: INTERNAL-PATHS
    ja: "local directory"
    en_public: "source data location"
    status: "forbidden"
    first_definition_required: false
    first_definition_location: ""
    avoid:
      - "directory name"
      - "script name"
      - "artifact name"
      - "filesystem path"
      - "HDF5 artifact"
    allowed_context:
      - "notes"
      - "refs"
    replacement_rule: "本文では path、script、artifact 名を直接書かず、再現性に必要な情報だけを公開可能な data product、processing step、regeneration manifest として説明する。"
    figure_label_rule: "axis、legend、caption に path や artifact 名を出さない。"
    owner: ""
    last_reviewed: ""
  - id: INTERNAL-AUTHORING-LABELS
    ja: "公開原稿へ出さない執筆・解析ラベル"
    en_public: "public manuscript wording"
    status: "forbidden"
    first_definition_required: false
    first_definition_location: ""
    avoid:
      - "target-snapshot sample"
      - "saved batch"
      - "all-multiplier onset"
      - "exposure diagnostic"
      - "public-facing analysis"
      - "public-facing analysis tables"
      - "uncurated provenance"
      - "not evidence"
      - "not used for ranking"
      - "not direct evidence"
      - "scope adjustment before submission"
      - "supplement-level analysis before submission"
    allowed_context:
      - "notes"
      - "refs"
      - "review"
    replacement_rule: "本文では内部 analysis label や review response 由来の defensive wording を出さず、denominator、対象、判断根拠、未解決事項を読者向けの文で説明する。未解決事項は notes/research-requests.md や review response matrix へ退避する。"
    figure_label_rule: "caption は図が何を示すかから始め、not evidence / not used for ranking 型の防御文は必要なら本文 limitation か review response に移す。"
    owner: ""
    last_reviewed: ""
