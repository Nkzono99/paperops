schema_version: 1

paper_type: computational_modeling

overlays:
  computational_modeling:
    method_requirements:
      - geometry_and_boundary_conditions
      - state_variables_and_update_law
      - initial_and_forcing_conditions
      - numerical_discretization
      - estimator_definition
      - verification_or_convergence
      - validity_domain
      - reproducibility_pointer
    result_requirements:
      - estimand_and_unit_of_analysis
      - denominator_or_case_count
      - comparison_definition
      - figure_or_table_reference
      - scope_statement
    figure_requirements:
      - model_or_state_visualization
      - estimator_or_decision_criterion
      - primary_evidence
      - mechanism_or_boundary_comparison
    figure_defaults:
      figure_1_role: model_or_state_visualization
      sensitivity_default: supplement
      screening_default: supplement
      max_main_sensitivity_figures: 1
    discussion_requirements:
      - mechanism_hypothesis
      - alternative_explanation
      - validity_domain
      - observable_or_experimental_discriminator

venue_overlay:
  name: 未記入
  checked_at: 未記入
  special_requirements: []

author_preferences:
  preferred_source_language: ja
  method_detail_bias: interpretation_relevant_first
  results_order_bias: claim_dependency_order
  discussion_bias: interpretation_with_scope

section_depth:
  length_is_floor_not_target: true
  profile: full_article
  soft_floor:
    full_article:
      results:
        ja_chars: 2400
        en_words: 900
        min_paragraphs: 6
      discussion:
        ja_chars: 2000
        en_words: 750
        min_paragraphs: 5
    short_article:
      results:
        ja_chars: 1200
        en_words: 450
        min_paragraphs: 3
      discussion:
        ja_chars: 1000
        en_words: 350
        min_paragraphs: 3
  subsection_policy:
    allowed_not_required: true
    min_paragraphs_per_subsection: 2
    one_paragraph_subsections: merge_or_expand
