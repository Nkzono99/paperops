[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-ops"
version = "0.1.0"
description = "CLI kernel for bootstrapping and maintaining paper-harness projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "paper-harness-template maintainers" },
]

[project.scripts]
pops = "paperops.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperops"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "paperops/_data/scaffold"
