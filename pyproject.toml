[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-harness-cli"
version = "0.9.0"
description = "CLI kernel for bootstrapping and maintaining paper-harness projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "paperops maintainers" },
]

[project.urls]
Homepage = "https://github.com/Nkzono99/paperops"
Repository = "https://github.com/Nkzono99/paperops"
Issues = "https://github.com/Nkzono99/paperops/issues"

[project.scripts]
pops = "paperops.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperops"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
