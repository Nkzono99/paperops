schema_version = "0.1"
layout_version = "0.1"

[project]
name = "paper-harness-template"
root = "."
kind = "target-repository"

[profile]
id = "paper-harness-upstream"
version = "0.1.0"
source = "builtin"
adapter = "paper_harness_upstream"

[overlay]
mode = "upstream-lab"
path = "harness-lab"
storage = "local"
local_id = "paper-harness-template"
managed_by = "harnessops"

[privacy]
default_visibility = "private-until-sanitized"

[agents]
codex = true
claude = true

[github_flow]
enabled = false

[target_harness]
provider = "paper-harness"
manifest = ".harness/manifest.toml"
