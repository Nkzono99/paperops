name: Skill request
description: Request a new template or scaffold skill.
title: "[skill-request] "
labels:
  - area:skills
  - type:enhancement
body:
  - type: input
    id: skill_name
    attributes:
      label: Proposed skill name
      placeholder: sync-reviewer-response
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What repeated task should the skill make safer or faster?
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and files
      description: Which files or artifacts should the skill read or update?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Clarify what the skill should avoid doing.
    validations:
      required: false
