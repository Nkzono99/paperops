name: スキルリクエスト
description: 新しいテンプレートまたはスキャフォールドのスキルをリクエストする。
title: "[skill-request] "
labels:
  - area:skills
  - type:enhancement
body:
  - type: input
    id: skill_name
    attributes:
      label: 提案するスキル名
      placeholder: sync-reviewer-response
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: 解決したいタスク
      description: このスキルによって、どの繰り返しタスクをより安全・高速にすべきですか？
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: 入力とファイル
      description: スキルが読み取りまたは更新すべきファイルやアーティファクトは何ですか？
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: スコープ外
      description: スキルが避けるべきことを明確にしてください。
    validations:
      required: false
