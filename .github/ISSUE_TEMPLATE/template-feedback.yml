name: テンプレートフィードバック
description: テンプレートで修正すべき繰り返しの摩擦を報告する。
title: "[template-feedback] "
labels:
  - scope:template
body:
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 摩擦または障害モードを説明してください。
      placeholder: 論文スキャフォールドでは...が困難です
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 下流の論文リポジトリで問題を再現する方法を説明してください。
      placeholder: 1. template/ から開始... 2. 実行...
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: 影響度
      options:
        - 執筆フローをブロックする
        - 手動クリーンアップの繰り返しが発生する
        - AI のガイダンスの信頼性が低下する
        - ドキュメントの明確さの問題
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: 提案する変更
      description: 部分的でも構わないので修正案を提案してください。
      placeholder: フックを追加、スキルを更新、スキャフォールドを調整...
    validations:
      required: false
  - type: textarea
    id: downstream_scope
    attributes:
      label: 下流での影響範囲
      description: この問題が発生したリポジトリや状況を列挙してください。
      placeholder: paper-lunar-cavity, paper-solar-wind-review, ...
    validations:
      required: false
