name: Structure change
description: Propose a change to the repository or scaffold structure.
title: "[structure-change] "
labels:
  - area:structure
body:
  - type: textarea
    id: current_pain
    attributes:
      label: Current pain
      description: What about the current layout is causing confusion or duplication?
    validations:
      required: true
  - type: textarea
    id: proposed_structure
    attributes:
      label: Proposed structure
      description: Describe the directory or file layout you want.
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility considerations
      options:
        - label: This would require downstream repository migration.
        - label: This can be introduced additively.
        - label: Documentation updates would be needed.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this structure better over time?
    validations:
      required: true
