name: 構造変更
description: リポジトリまたはスキャフォールドの構造変更を提案する。
title: "[structure-change] "
labels:
  - area:structure
body:
  - type: textarea
    id: current_pain
    attributes:
      label: 現在の問題点
      description: 現在のレイアウトのどこが混乱や重複を引き起こしていますか？
    validations:
      required: true
  - type: textarea
    id: proposed_structure
    attributes:
      label: 提案する構造
      description: 希望するディレクトリまたはファイルレイアウトを記述してください。
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: 互換性の考慮事項
      options:
        - label: この変更には下流リポジトリのマイグレーションが必要になる。
        - label: この変更は追加的に導入できる。
        - label: ドキュメントの更新が必要になる。
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 根拠
      description: なぜこの構造が長期的に優れているのですか？
    validations:
      required: true
