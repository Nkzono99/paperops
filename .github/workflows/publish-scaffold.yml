name: スキャフォールド公開

on:
  push:
    branches:
      - main
    paths:
      - "template/**"
      - "scripts/publish-scaffold.sh"
      - ".github/workflows/publish-scaffold.yml"
      - "docs/distribution.md"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "配布リポジトリの owner/repo を上書き指定（任意）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-scaffold
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: ${{ inputs.target_repo != '' && inputs.target_repo || vars.PUBLISH_TARGET_REPO }}
    steps:
      - name: 設定を検証
        run: |
          if [ -z "${TARGET_REPO}" ]; then
            echo "PUBLISH_TARGET_REPO 変数が設定されておらず、workflow_dispatch の入力もありません。" >&2
            exit 1
          fi
          if [ -z "${{ secrets.PUBLISH_TEMPLATE_TOKEN }}" ]; then
            echo "PUBLISH_TEMPLATE_TOKEN シークレットが必要です。" >&2
            exit 1
          fi

      - name: ソースリポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: git ID を設定
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 配布リポジトリをクローン
        env:
          TOKEN: ${{ secrets.PUBLISH_TEMPLATE_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" "$RUNNER_TEMP/distribution-repo"

      - name: スキャフォールドを同期
        run: |
          chmod +x scripts/publish-scaffold.sh
          ./scripts/publish-scaffold.sh \
            --source-dir template \
            --target-dir "$RUNNER_TEMP/distribution-repo"

      - name: 変更があればコミットしてプッシュ
        working-directory: ${{ runner.temp }}/distribution-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "公開するスキャフォールドの変更はありません。"
            exit 0
          fi
          git commit -m "Publish scaffold from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main
