name: Publish Scaffold

on:
  push:
    branches:
      - main
    paths:
      - "template/**"
      - "scripts/publish-scaffold.sh"
      - ".github/workflows/publish-scaffold.yml"
      - "docs/distribution.md"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Optional owner/repo override for the distribution repository"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-scaffold
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: ${{ inputs.target_repo != '' && inputs.target_repo || vars.PUBLISH_TARGET_REPO }}
    steps:
      - name: Validate configuration
        run: |
          if [ -z "${TARGET_REPO}" ]; then
            echo "PUBLISH_TARGET_REPO variable is not set and no workflow_dispatch input was provided." >&2
            exit 1
          fi
          if [ -z "${{ secrets.PUBLISH_TEMPLATE_TOKEN }}" ]; then
            echo "PUBLISH_TEMPLATE_TOKEN secret is required." >&2
            exit 1
          fi

      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone distribution repository
        env:
          TOKEN: ${{ secrets.PUBLISH_TEMPLATE_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" "$RUNNER_TEMP/distribution-repo"

      - name: Sync scaffold
        run: |
          chmod +x scripts/publish-scaffold.sh
          ./scripts/publish-scaffold.sh \
            --source-dir template \
            --target-dir "$RUNNER_TEMP/distribution-repo"

      - name: Commit and push if changed
        working-directory: ${{ runner.temp }}/distribution-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No scaffold changes to publish."
            exit 0
          fi
          git commit -m "Publish scaffold from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main
