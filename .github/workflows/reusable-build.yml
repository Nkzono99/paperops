name: 再利用可能ビルド

on:
  workflow_call:
    inputs:
      working-directory:
        description: 検証対象のリポジトリルート。
        required: false
        type: string
        default: .
      run-latex:
        description: 利用可能な場合に latexmk コンパイルを試行する。
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ハーネスチェックを実行
        run: |
          if [ "${{ inputs.run-latex }}" = "true" ]; then
            export PAPER_TEMPLATE_RUN_LATEX=1
          else
            export PAPER_TEMPLATE_RUN_LATEX=0
          fi
          make ci
