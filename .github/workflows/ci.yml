name: Smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: smoke を実行
        run: make smoke
