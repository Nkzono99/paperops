name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release only from main, with a tag that matches the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Release tag ${RELEASE_TAG} is not reachable from origin/main."
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match pyproject version ${version}."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Check
        run: |
          uv sync --dev
          uv run ruff check src tests
          uv run pytest

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-distribution
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paper-harness-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distribution
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
