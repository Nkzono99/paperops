name: PyPI 公開

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: main 由来の release だけを許可
        run: |
          git fetch origin main --tags
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Manual PyPI publish must run from main."
              exit 1
            fi
            exit 0
          fi
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ビルドツールをインストール
        run: python -m pip install --upgrade build twine

      - name: distribution をビルド
        run: python -m build

      - name: distribution を検証
        run: python -m twine check dist/*

      - name: distribution をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paper-harness-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: distribution をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist

      - name: PyPI に公開
        uses: pypa/gh-action-pypi-publish@release/v1
