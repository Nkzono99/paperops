name: PyPI 公開

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ビルドツールをインストール
        run: python -m pip install --upgrade build twine

      - name: distribution をビルド
        run: python -m build

      - name: distribution を検証
        run: python -m twine check dist/*

      - name: distribution をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paper-harness-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: distribution をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist

      - name: PyPI に公開
        uses: pypa/gh-action-pypi-publish@release/v1
