name: 再利用可能ミラーチェック

on:
  workflow_call:
    inputs:
      working-directory:
        description: 検証対象のリポジトリルート。
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  mirror-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ミラーチェックを実行
        run: python3 scripts/mirror-check.py --root manuscript --report manuscript/mirror/reports/ci-report.md
