name: Reusable Mirror Check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository root to validate.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  mirror-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mirror check
        run: python3 scripts/mirror-check.py --root manuscript --report manuscript/mirror/reports/ci-report.md
