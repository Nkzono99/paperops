name: 再利用可能リリース

on:
  workflow_call:
    inputs:
      working-directory:
        description: パッケージ対象のリポジトリルート。
        required: false
        type: string
        default: .
      artifact-name:
        description: アップロードするアーティファクトの名前。
        required: false
        type: string
        default: arxiv-export

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: エクスポートバンドルを準備
        run: ./scripts/export-arxiv.sh

      - name: エクスポートアーティファクトをアップロード
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/arxiv-export
